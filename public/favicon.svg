<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ezyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background rounded app card -->
  <rect width="512" height="512" rx="120" fill="#0f172a" />
  
  <!-- Subtle inner background accent circle -->
  <circle cx="256" cy="220" r="170" fill="#f43f5e" opacity="0.12" />

  <!-- Outer Map Pin Badge -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Map Pin shape -->
    <path d="M0 -150 C-85 -150 -150 -85 -150 0 C-150 75 -40 155 0 205 C40 155 150 75 150 0 C150 -85 85 -150 0 -150 Z" fill="url(#ezyGrad)"/>
    
    <!-- House silhouette inside pin -->
    <path d="M0 -90 L-72 -22 V60 H-24 V12 H24 V60 H72 V-22 Z" fill="#ffffff" />
    
    <!-- Doorway Accent -->
    <path d="M-18 60 V16 C-18 8 -10 0 0 0 C10 0 18 8 18 16 V60 Z" fill="#f43f5e" />
  </g>
</svg>
